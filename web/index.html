<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#1b222c" />
    <!-- Real window/taskbar icon for the Edge `--app` window (a Chromium app
         window otherwise falls back to the Edge logo). Assets are generated by
         launcher/make-icon.mjs into web/public/ and served from the dist root.
         The manifest names the icon set only — it is intentionally not
         installable (no display/start_url) so no PWA pins the auto-picked port. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>AI Session Manager</title>
    <!-- Inline (= --bg-app in tokens.css) so there is no white flash before
         the bundle's CSS lands; the one sanctioned color outside tokens. -->
    <style>
      html {
        background: #171d25;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!--
      The AUTH_TOKEN placeholder below is replaced with the real auth token by
      the backend when it serves / from web/dist. It must survive the Vite
      build verbatim and appear exactly once in this file.
    -->
    <script>
      window.__AUTH__ = '__AUTH_TOKEN__';
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
