<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude peek mascot</title>
    <!-- Transparent by default: this page is meant to be shown in a
         transparent, always-on-top overlay window at the edge of the monitor,
         so it must never paint a background of its own. `overflow:hidden` is
         load-bearing — the screen edge is what clips the mascots. -->
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="mascot"></div>
    <script type="module" src="/src/mascot/main.ts"></script>
  </body>
</html>
