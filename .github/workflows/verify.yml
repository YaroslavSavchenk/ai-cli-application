# The verification suite, in one place: typecheck, frontend build, committed
# icon artifacts, and the backend test suite. Called by `ci.yml` (push to main,
# every pull request) and by `release.yml` (a `v*` tag must pass this before
# anything is published), so CI and a release prove exactly the same thing about
# exactly the same commit.
#
# Two facts that explain the shape below:
#   - node-pty 1.1.0 ships NO linux-x64 prebuild, so `npm ci` compiles it from
#     source here (node-gyp); the ubuntu-latest image supplies the toolchain it
#     needs (build-essential + python3). That compile is why the timeouts are
#     generous.
#   - the launcher-config tests self-skip on Linux: they drive the real
#     PowerShell scripts through WSL interop, and a GitHub ubuntu runner has no
#     `powershell.exe`. `npm test` therefore stays one command everywhere.
#
# If the suite turns out to be flaky here, tighten or quarantine the offending
# test -- do not silence the job.

name: Verify

on:
  workflow_call:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

jobs:
  check:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and `npm ci` runs dependency lifecycle
          # scripts -- they must not find a token in .git/config.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build the frontend
        run: npm run build

      - name: Verify the committed icon artifacts
        run: node launcher/make-icon.mjs --check

  test:
    name: backend test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and `npm ci` runs dependency lifecycle
          # scripts -- they must not find a token in .git/config.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tests/auth.test.ts runs `npm run build` itself on a fresh checkout
      # (tests/auth.test.ts:129); doing it here keeps that cost out of a test's
      # own timeout and gives a clean failure if the build is what broke.
      - name: Build the frontend
        run: npm run build

      # Spawns real servers and PTYs. See the note at the top of this file.
      - name: Run the test suite
        run: npm test
