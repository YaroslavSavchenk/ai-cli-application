# Continuous integration: prove that main and every pull request still
# typechecks, builds, ships the committed icon artifacts, and passes the
# backend test suite.
#
# The jobs themselves live in `verify.yml`, which `release.yml` calls too, so a
# release is gated on exactly the checks that run here.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
