# Release build: makes the Windows-side native host window downloadable, so a
# newcomer does not have to build it themselves.
#
# What this does NOT do: it does not package the app. The app is a Node backend
# that runs INSIDE WSL2 and is installed by cloning this repository (see the
# "Install" section of README.md). The only artifact here is
# `AiSessionManagerHost-win-x64.zip` -- the four files that
# `launcher/build-host.ps1` produces into `launcher/host/build/`, which give the
# app its own Windows taskbar identity. Everything in it is built from the
# source of the tag being released; nothing is committed to the repo.
#
# Triggers:
#   - push of a `v*` tag  -> build, then publish a GitHub Release with the zip
#                            and SHA256SUMS.txt attached;
#   - workflow_dispatch   -> build and upload the same two files as a workflow
#                            artifact. Dispatched from a branch it publishes
#                            nothing; dispatched on a `v*` tag it publishes
#                            exactly like a tag push (the publish job gates on
#                            the ref, not on the trigger).
#
# The exe is NOT code-signed. Windows SmartScreen may warn on first run. The
# WebView2 SDK it links against is pinned by version AND SHA-256 inside
# build-host.ps1, which refuses to build if either does not match.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Nothing by default; only the `release` job is granted write access.
permissions: {}

concurrency:
  # Never cancel a publish that is already running: a half-uploaded release is
  # worse than a queued one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Proves the tagged source actually builds before anything is published.
  check:
    name: typecheck + build (source)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and `npm ci` runs dependency lifecycle
          # scripts -- they must not find a token in .git/config.
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build the frontend
        run: npm run build

      - name: Verify the committed icon artifacts
        run: node launcher/make-icon.mjs --check

  # Builds the native WebView2 host on Windows and packages it.
  host:
    name: native host (win-x64)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    # `powershell` is Windows PowerShell 5.1, which is what build-host.ps1 and
    # the packaging below are written for (Compress-Archive, Get-FileHash).
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes, and this job runs a build script over the
          # checkout -- it must not find a token in .git/config.
          persist-credentials: false

      # No .NET SDK is installed or needed: build-host.ps1 compiles with the
      # in-box .NET Framework compiler at
      # C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe, which exists on
      # the GitHub windows-latest image (.NET Framework 4.8 is in-box on
      # Windows Server). It downloads the pinned Microsoft.Web.WebView2
      # 1.0.3405.78 NuGet package and verifies its size + SHA-256 before using
      # a single byte of it.
      - name: Build the native host
        run: powershell -NoProfile -ExecutionPolicy Bypass -File launcher/build-host.ps1

      - name: Package the host (zip + SHA256SUMS)
        run: |
          $ErrorActionPreference = 'Stop'

          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'launcher\host\build'
          # Exactly these four, nothing else, in this order.
          $names = @(
            'AiSessionManagerHost.exe',
            'Microsoft.Web.WebView2.Core.dll',
            'Microsoft.Web.WebView2.WinForms.dll',
            'WebView2Loader.dll'
          )

          $files = @()
          foreach ($n in $names) {
            $p = Join-Path $buildDir $n
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) {
              throw "build output missing: $p"
            }
            $files += Get-Item -LiteralPath $p
          }
          $extra = @(Get-ChildItem -LiteralPath $buildDir | Where-Object { $names -notcontains $_.Name })
          if ($extra.Count -gt 0) {
            throw ("unexpected entries in ${buildDir}: " + (($extra | ForEach-Object { $_.Name }) -join ', '))
          }

          Write-Host '--- launcher/host/build ---'
          foreach ($f in $files) { Write-Host ('  {0,10}  {1}' -f $f.Length, $f.Name) }

          $outDir = Join-Path $env:GITHUB_WORKSPACE 'dist-release'
          if (Test-Path -LiteralPath $outDir) { Remove-Item -LiteralPath $outDir -Recurse -Force }
          [void](New-Item -ItemType Directory -Path $outDir -Force)

          $zip = Join-Path $outDir 'AiSessionManagerHost-win-x64.zip'
          # A list of FILE paths puts every entry at the zip root -- no nested
          # folder, so extracting into launcher/host/build/ yields the 4 files.
          Compress-Archive -Path ($files | ForEach-Object { $_.FullName }) -DestinationPath $zip -CompressionLevel Optimal

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
          } finally {
            $archive.Dispose()
          }
          if ($entries.Count -ne $names.Count) {
            throw ("zip holds $($entries.Count) entries, expected $($names.Count): " + ($entries -join ', '))
          }
          foreach ($e in $entries) {
            if ($e -match '[\\/]') { throw "zip entry is nested, expected zip root: $e" }
            if ($names -notcontains $e) { throw "unexpected zip entry: $e" }
          }
          Write-Host ('zip entries: ' + ($entries -join ', '))

          # sha256sum-compatible: lowercase hex, two spaces, bare file name, LF.
          # The zip first, then each file it contains.
          $lines = @()
          $lines += ('{0}  {1}' -f (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant(), (Split-Path -Leaf $zip))
          foreach ($f in $files) {
            $lines += ('{0}  {1}' -f (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $f.Name)
          }
          $sums = Join-Path $outDir 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($sums, (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))

          Write-Host '--- dist-release ---'
          Get-ChildItem -LiteralPath $outDir | ForEach-Object { Write-Host ('  {0,10}  {1}' -f $_.Length, $_.Name) }
          Write-Host '--- SHA256SUMS.txt ---'
          foreach ($l in $lines) { Write-Host $l }

      - name: Upload the packaged host
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AiSessionManagerHost-win-x64
          path: |
            dist-release/AiSessionManagerHost-win-x64.zip
            dist-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  # Tag pushes only. Publishes what `host` built, with the `gh` CLI that is
  # preinstalled on the runner -- no third-party release action.
  release:
    name: publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [check, host]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download the packaged host
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: AiSessionManagerHost-win-x64
          path: dist-release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh needs to be told which repo it is.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist-release
          ls -l
          sha256sum -c --ignore-missing SHA256SUMS.txt
          ZIP_SHA="$(awk '$2 == "AiSessionManagerHost-win-x64.zip" { print $1 }' SHA256SUMS.txt)"
          test -n "$ZIP_SHA"

          cat > notes.md <<EOF
          ### Windows host window (optional download)

          \`AiSessionManagerHost-win-x64.zip\` is **not the app** — the app is a
          Node backend that runs inside WSL2 and is installed by cloning this
          repository. The zip holds the small native **WebView2 host window**
          the Windows launcher opens the UI in, so the app gets its own taskbar
          button and icon instead of Edge's. Building it yourself with
          \`launcher/build-host.ps1\` produces the same four files; this
          download only saves you that step.

          **Install:** extract the four files into \`launcher/host/build/\`
          inside your clone (create the folder), then run
          \`launcher/make-shortcut.ps1\`. Full instructions:
          [README → Install]($REPO_URL#install).

          SHA-256 of the zip:

          \`\`\`
          $ZIP_SHA  AiSessionManagerHost-win-x64.zip
          \`\`\`

          \`SHA256SUMS.txt\` additionally lists the hash of each of the four
          extracted files (\`sha256sum\`-compatible; on Windows use
          \`Get-FileHash\`).

          **The exe is not code-signed.** It is compiled by GitHub Actions from
          the source of this tag, against a WebView2 SDK pinned by version and
          verified by SHA-256. Windows SmartScreen may show "Windows protected
          your PC" the first time — *More info → Run anyway*. Everything the app
          does stays on 127.0.0.1.
          EOF

          # Idempotent: a re-run after a failed publish updates the existing
          # release instead of erroring on "release already exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — uploading assets with --clobber"
            gh release upload "$TAG" \
              AiSessionManagerHost-win-x64.zip SHA256SUMS.txt --clobber
            # The re-uploaded zip is a NEW file (csc and Compress-Archive are
            # not deterministic), so the hash in the old body no longer matches
            # the asset that is now attached. Rewrite the body from the notes
            # built above. Cost: a re-run drops the auto-generated changelog
            # that --generate-notes appended on the first publish. A body whose
            # SHA-256 matches the download is worth more than that changelog.
            echo "refreshing the release notes so the published hash matches the uploaded zip"
            gh release edit "$TAG" --notes-file notes.md
          else
            # --notes-file supplies the block above; --generate-notes appends
            # GitHub's own changelog under it (gh: "Additional release notes can
            # be prepended to automatically generated notes").
            gh release create "$TAG" \
              --verify-tag \
              --title "$TAG" \
              --notes-file notes.md \
              --generate-notes \
              AiSessionManagerHost-win-x64.zip SHA256SUMS.txt
          fi
          gh release view "$TAG" --json tagName,url,assets \
            --jq '.tagName + " " + .url + "\n" + (.assets[] | .name + " " + (.size|tostring))'
